<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Smiley face yellow background with a thin black border -->
    <circle cx="50" cy="50" r="45" fill="#fbc02d" stroke="#000000" stroke-width="2.5"/>
    <!-- Left eye -->
    <circle cx="35" cy="40" r="5" fill="#000000"/>
    <!-- Right eye -->
    <circle cx="65" cy="40" r="5" fill="#000000"/>
    <!-- Smile (Quadratic Bezier Curve) -->
    <path d="M 32 58 Q 50 82 68 58" fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round"/>
</svg>
